[package]
name = "wasm-scraper"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
scraper = "0.19"
lightningcss = "1"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
regex = "1"

[profile.release]
opt-level = "z"
lto = true
