[package]
name = "wasm-scraper"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
scraper = "0.19"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
regex = "1"
serde-wasm-bindgen = "0.6"

# Explicitly add both getrandom versions with proper features
getrandom = { version = "0.2", features = ["js"] }

# Override ahash to use the version that requires getrandom 0.3 with wasm_js feature
ahash = { version = "0.8", default-features = false, features = ["getrandom"] }

[dependencies.getrandom03]
package = "getrandom"
version = "0.3"
features = ["wasm_js"]

[profile.release]
opt-level = "z"
lto = true
